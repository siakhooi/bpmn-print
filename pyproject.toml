[project]
name = "bpmn_print"
version = "0.5.0"
description = "Print BPMN workflow for developer readings"
authors = [
    {name = "Siak Hooi",email = "siakhooi@gmail.com"}
]
keywords = [ "bpmn", "workflow", "print", "diagram", "xml" ]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities"
]

license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "lxml (>=6.1.0,<7.0.0)",
    "reportlab (>=4.5.0,<5.0.0)",
    "graphviz (>=0.21,<0.22)",
    "pillow (>=11.0.0,<12.0.0)"
]

[project.urls]
homepage = "https://github.com/siakhooi/bpmn-print"
repository = "https://github.com/siakhooi/bpmn-print"
documentation = "https://github.com/siakhooi/bpmn-print/wiki"
"Bug Tracker" = "https://github.com/siakhooi/bpmn-print/issues"

[project.scripts]
bpmn-print = 'bpmn_print.cli:run'


[tool.poetry]
packages = [{include = "bpmn_print", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
flake8 = "^7.2.0"
pytest-mock = "^3.15.1"
black = "^26.3.1"

[tool.black]
line-length = 79
target-version = ["py310"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
